[workspace]

members = [
    "crates/common",
    "crates/direct_access",
    "crates/frontend",
    "crates/handling_manifest",
    "crates/cpp_qt_file_generation",
    "crates/rust_file_generation",
    "crates/handling_app_lifecycle",
    "crates/file_generation_shared_steps",
    "crates/teksilo_ui",
    "crates/macros",
    "crates/naming",
]
# A bare `cargo build` builds the Teksilo application and its CLI.
default-members = [
    "crates/teksilo_ui",
]

resolver = "3"

[workspace.package]
homepage = "https://github.com/ferntech-eu/qleany"
repository = "https://github.com/ferntech-eu/qleany"
license = "MPL-2.0"
edition = "2024"
version = "2.0.0"
authors = ["Cyril Jacquet <cyril.jacquet@ferntech.eu>"]
documentation = "https://docs.rs/qleany/"
readme = "README.md"
description = """
Architecture generator for Rust and C++/Qt applications.
"""
keywords = ["architecture", "scaffold", "codegen", "rust", "qt"]
categories = ["development-tools", "template-engine", "gui", "command-line-utilities", "data-structures"]

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
flume = "0.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
chrono = { version = "0.4" , features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# FernTech's own GUI framework, the toolkit crates/teksilo_ui is written in.
#
# Declared against crates.io so CI, `cargo publish` and the maturin wheel build
# all resolve without a sibling checkout. Building against a local teksilo is a
# LOCAL concern, done with an untracked `.cargo/config.toml`; CONTRIBUTING has
# the procedure and the lockfile it damages.
#
# `theme-fluent` is what makes `teksilo::presets::fluent::{light,dark}` exist.
# `automation` installs the debug-only bridge the scripts/automation_*.py probes
# attach to. `async-std` (not bare `async`) because bare `async` installs an
# executor with NO reactor: it runs `spawn_blocking` futures fine and then hangs
# silently the first time anything awaits a native future.
teksilo = { version = "0.14.3", features = [
    "theme-fluent",
    "automation",
    "async-std",
] }

# Internal crates
common = { package = "qleany-common", version = "2.0.0", path = "crates/common" }
macros = { package = "qleany-macros", version = "2.0.0", path = "crates/macros" }
direct_access = { package = "qleany-direct-access", version = "2.0.0", path = "crates/direct_access" }
frontend = { package = "qleany-frontend", version = "2.0.0", path = "crates/frontend" }
handling_manifest = { package = "qleany-handling-manifest", version = "2.0.0", path = "crates/handling_manifest" }
rust_file_generation = { package = "qleany-rust-file-generation", version = "2.0.0", path = "crates/rust_file_generation" }
cpp_qt_file_generation = { package = "qleany-cpp-qt-file-generation", version = "2.0.0", path = "crates/cpp_qt_file_generation" }
handling_app_lifecycle = { package = "qleany-handling-app-lifecycle", version = "2.0.0", path = "crates/handling_app_lifecycle" }
file_generation_shared_steps = { package = "qleany-file-generation-shared-steps", version = "2.0.0", path = "crates/file_generation_shared_steps" }
naming = { package = "qleany-naming", version = "2.0.0", path = "crates/naming" }

[workspace.lints.rust]

[workspace.metadata]

[workspace.metadata.teksilo]
probe = "0.14.3"


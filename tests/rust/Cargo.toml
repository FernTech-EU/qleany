# Workspace root for Rust functional tests.
# Includes the generated project crates + our functional test crate.
# The generated tested_project/Cargo.toml is removed after generation
# so that this file is the sole workspace root.

[workspace]
members = [
    "tested_project/crates/common",
    "tested_project/crates/direct_access",
    "tested_project/crates/macros",
    "tested_project/crates/project_management",
    "tested_project/crates/task_management",
    "tested_project/crates/frontend",
    # Every UI scaffold the Rust example enables. None of these were members
    # until now, so nothing ever compiled them -- which is how the mobile
    # bridge came to be broken for several releases without a red build.
    "tested_project/crates/cli",
    "tested_project/crates/teksilo_ui",
    "tested_project/crates/slint_ui",
    "tested_project/crates/mobile_bridge",
    "functional",
]
resolver = "3"

[workspace.package]
homepage = ""
repository = ""
license = "choose it yourself"
edition = "2024"
version = "0.0.1"
authors = ["to-be-filled"]
documentation = "https://docs.rs/{{ s.global.application_kebab_name }}/"
description = "built with Qleany clean architecture."
keywords = ["to-be-filled"]
categories = ["to-be-filled"]
readme = "README.md"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
flume = "0.12"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

# Internal crates (must match generated package names)
common = { package = "full-rust-app-common", version = "0.0.1", path = "tested_project/crates/common" }
macros = { package = "full-rust-app-macros", version = "0.0.1", path = "tested_project/crates/macros" }
direct_access = { package = "full-rust-app-direct-access", version = "0.0.1", path = "tested_project/crates/direct_access" }
project_management = { package = "full-rust-app-project-management", version = "0.0.1", path = "tested_project/crates/project_management" }
task_management = { package = "full-rust-app-task-management", version = "0.0.1", path = "tested_project/crates/task_management" }
frontend = { package = "full-rust-app-frontend", version = "0.0.1", path = "tested_project/crates/frontend" }

# Debuginfo, not compilation, dominates a Teksilo project's disk footprint.
# Measured on examples/rust/full: under Cargo's default `debug = 2` the demo
# binary was 685 MB, of which 557 MB -- 81% -- was debug sections, and
# tests/rust/target had reached 22 GB. That matters twice over: GitHub's Actions
# cache is capped at 10 GB per repository, so a tree this size cannot be cached
# at all, and a contributor's disk fills up.
#
# `line-tables-only` keeps exactly what a bug report needs -- `file:line` in
# panic messages and backtraces -- and drops only the variable and type
# information a *step-debugger* wants. To run one crate under gdb/lldb, override
# that crate rather than editing this line:
#
#     [profile.dev.package.teksilo_ui]
#     debug = 2
#
# `split-debuginfo = "unpacked"` then leaves the reduced DWARF in the object
# files beside the binary instead of copying it into the executable at link time.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[workspace.lints.rust]
